      line('야근한 남자','이야기','넥타이도 못 푼 채 침대에 쓰러졌다. 스물여덟, 입사 7년 차. 팀장 기분 맞추기, 막내 실수 덮어주기, 웃으면서 퇴근하기. 오늘도 셋 다 해냈는데 어깨는 왜 이렇게 무거운지.','bedroom',4),
      line('야근한 남자','이야기','내일은 제발 팀장님이 조용하시기를. 그렇게 눈을 감으려는 순간, 꺼져 있던 TV에서 들려오는 소리. 지직.','room',5),
      line('이상한 소리','주인공','“어라? 난 TV 튼 적이 없는데. 아니, 설마 리모컨이 눌렸나?”','bedroom',6),
      line('???','???','“찾았다. 이 사람이에요.”','bedroom',7,'light'),
      line('작은 빛','이야기','새까만 화면 한가운데, 분홍빛 점 하나. 별처럼 밝아지는가 싶더니 화면 가장자리가 물결처럼 일렁이기 시작했다.','bedroom',8,'light'),

      line('뜻밖의 손님','주인공','“……아, 드디어 왔구나. 야근을 너무 해서 내가 돌아 버렸어. 이거 산재 처리 되나?”','bedroom',12,'goddess'),

      line('여신의 선언','이야기','여신이 환하게 웃자, 바닥에 남아 있던 꽃잎이 잠깐 둥실 떠올랐다.','bedroom',14,'goddess'),
      line('여신의 선언','사랑의 여신','“세계를 구하기 위해 결혼해야 합니다.”','bedroom',15,'goddess'),
      {tag:'여신의 선언',who:'이야기',text:'머리가 하얘졌다. 일단 뭐라도 대답은 해야 하는데—',art:'bedroom',visual:'goddess',choices:[['“저기요, 저 잠깐 상황 파악이 안 되는데요!”',16],['“결혼이요? 지금 새벽 한 시인데요?”',16],['“……잠깐만요. 누구랑요?”',16]]},

      line('글로벌한 얼굴','이야기','전혀 기쁘지 않았다.','bedroom',30,'goddess'),
      line('작은 약속','사랑의 여신','“당장 끝나지는 않겠죠. 그래도 좋아하는 사람이 사는 곳에 전쟁을 걸기는 좀 어렵잖아요? 당신 같은 사람이 한 명쯤 끼어 있으면 더더욱요. ……아, 왜 하필 당신이냐고요?”','bedroom',24,'goddess'),

    const heroines={sera:{name:'마왕',kind:'마계의 지배자',desc:'끊임없이 찾아오는 인간 용사들에게 지친 마왕. 당신의 넉살은 그녀에게도 통할까? 일단 첫인상은 말 많은 침입자다. 호감도 −100에서 시작한다.'},lune:{name:'루네',kind:'숲의 종족 치유사',desc:'말보다 행동을 믿는 치유사. 오래된 불신 너머의 마음을 볼 줄 안다.'},mira:{name:'미라',kind:'산의 종족 마도공학자',desc:'낙천적인 발명가. 닫힌 성문을 열 방법을 늘 새롭게 찾는다.'}};
    let scene=0;let scores={sera:0,lune:0,mira:0};let first=null;let auto=false;let started=false;let timer=null;const history=[];

    function warpTo(done){
      if(document.querySelector('.warp'))return;
      const o=document.createElement('div');o.className='warp';o.innerHTML='<canvas></canvas><div class="warp-white"></div>';document.body.append(o);
      const cv=o.querySelector('canvas'),ctx=cv.getContext('2d'),white=o.querySelector('.warp-white'),game=document.querySelector('.game');
      const dpr=Math.min(devicePixelRatio||1,1.5);let W=0,H=0;const fit=()=>{W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr};fit();
      const stars=Array.from({length:220},()=>({a:Math.random()*Math.PI*2,r:Math.random()*.3+.02,s:.6+Math.random()*1.4,c:Math.random()<.35?'255,170,215':Math.random()<.5?'255,236,250':'190,215,255'}));
      game.classList.add('warping');document.documentElement.classList.add('warping-doc');const t0=performance.now();const IN=1.5;
      (function frame(now){
        const t=(now-t0)/1000;if(!o.isConnected)return;
        ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);
        const cx=W/2,cy=H*.42,R=Math.hypot(W,H)*.6,sp=Math.min(1,t/IN);
        const g=ctx.createRadialGradient(cx,cy,0,cx,cy,R*(.15+sp*.9));g.addColorStop(0,`rgba(255,240,250,${.25+sp*.6})`);g.addColorStop(.35,`rgba(255,160,210,${.18+sp*.3})`);g.addColorStop(1,'rgba(40,10,40,0)');
        ctx.fillStyle=`rgba(12,6,20,${Math.min(.55,t*.8)*(1-sp*.4)})`;ctx.fillRect(0,0,W,H);ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
        ctx.lineCap='round';
        for(const st of stars){
          st.r*=1+(.012+.09*sp*sp)*st.s;if(st.r>1.15)st.r=.02+Math.random()*.05;
          const r1=st.r*R,r0=r1*(1-.08-.35*sp*sp);
          ctx.strokeStyle=`rgba(${st.c},${Math.min(1,st.r*2.2)})`;ctx.lineWidth=(.6+st.r*3.2)*st.s;
          ctx.beginPath();ctx.moveTo(cx+Math.cos(st.a)*r0,cy+Math.sin(st.a)*r0);ctx.lineTo(cx+Math.cos(st.a)*r1,cy+Math.sin(st.a)*r1);ctx.stroke();
        }
        white.style.opacity=t<IN-.55?0:Math.min(1,(t-(IN-.55))/.55);
        if(t<IN+.35)requestAnimationFrame(frame);

      })(t0);
    }
