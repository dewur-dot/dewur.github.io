<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>마왕 · 표정 스튜디오</title>
<style>
:root{color-scheme:dark;font-family:Georgia,'Malgun Gothic',serif;background:#151217;color:#e7dbcf}*{box-sizing:border-box}body{margin:0}button,a{font:inherit}button{cursor:pointer}header{display:flex;justify-content:space-between;align-items:center;padding:22px 4vw;border-bottom:1px solid #cba98728}header small{color:#b39b80;letter-spacing:.22em;font:10px Arial}header h1{font-size:20px;font-weight:400;margin:6px 0 0}header a{font-size:12px;color:#bba995;text-decoration:none}main{display:grid;grid-template-columns:minmax(360px,1.25fr) minmax(320px,.75fr);max-width:1280px;margin:auto;min-height:calc(100dvh - 90px)}.stage{position:relative;min-height:650px;height:calc(100dvh - 90px);background:radial-gradient(ellipse at 50% 45%,#4e3442,#201923 65%);overflow:hidden}.stage[data-tone=paper]{background:#d8cec2}.stage[data-tone=grid]{background-color:#a9a5aa;background-image:conic-gradient(#c2bec3 25%,transparent 0 50%,#c2bec3 0 75%,transparent 0);background-size:24px 24px}.portrait-mount{position:absolute;inset:15px 0 10px}.stage-tag{position:absolute;left:24px;top:22px;color:#d7b7a0;font:11px Arial;letter-spacing:.18em;z-index:1}.stage[data-tone=paper] .stage-tag,.stage[data-tone=grid] .stage-tag{color:#50434c}.side{padding:clamp(25px,4vw,54px);align-self:center}.kicker{font:10px Arial;letter-spacing:.2em;color:#ab867d}.side h2{font-size:36px;font-weight:400;margin:12px 0}.summary{font-size:14px;line-height:1.9;color:#bdaea8;margin:0 0 26px}.expressions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.expressions button{border:1px solid #b8967736;background:#ffffff04;color:#bdaea8;padding:13px 4px;font-size:13px;border-radius:3px;transition:background .15s,color .15s}.expressions button:hover{background:#ad7b691c;color:#f3dbca}.expressions button[aria-pressed=true]{background:#ac7e6829;border-color:#cfab89;color:#f3d7b7}.divider{height:1px;background:#cba98724;margin:27px 0}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:15px 0;font-size:12px;color:#bdaea8}.tones{display:flex;gap:7px}.tones button{border:1px solid #cba98744;background:transparent;color:#bdaea8;font-size:11px;border-radius:20px;padding:7px 11px}.tones button[aria-pressed=true]{border-color:#d3b494;color:#f3d7b7}.compare{width:100%;padding:12px;color:#d3b494;background:transparent;border:1px solid #cba98744;border-radius:3px;font-size:12px}.compare[aria-pressed=true]{background:#b5907022}.dialogue{margin-top:30px;padding:20px 22px;border-left:2px solid #bc8a79;background:linear-gradient(90deg,#8c615414,transparent)}.speaker{font-size:12px;color:#dfb898}.line{font-size:17px;line-height:1.7;margin:10px 0 0;min-height:58px}.help{font:11px/1.8 Arial,'Malgun Gothic',sans-serif;color:#8f7d78;margin-top:22px}.status{font-size:11px;color:#ad9c85;min-height:16px;margin-top:12px}@media(max-width:720px){main{display:flex;flex-direction:column}.stage{min-height:0;height:65dvh;flex:none}.side{width:100%;padding:24px}.side h2{font-size:28px}.summary{margin-bottom:18px}.expressions{grid-template-columns:repeat(4,1fr)}header{padding:15px 20px}.portrait-mount{inset:5px 0 0}.stage-tag{top:15px;left:20px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head>
<body><header><div><small>CHARACTER / EXPRESSION</small><h1>마왕 · 표정 스튜디오</h1></div><a href="../index.html">게임으로 돌아가기 ↗</a></header>
<main><section class="stage" id="stage" data-tone="dark" aria-label="마왕 스탠딩 미리보기"><span class="stage-tag">DEMON QUEEN</span><div class="portrait-mount" id="portrait"></div></section>
<section class="side"><span class="kicker">EVERYDAY CONVERSATION</span><h2 id="name">화남 · 기본</h2><p class="summary">익숙한 짜증부터 낯선 설렘까지.<br>마왕의 표정을 골라보세요.</p><div class="expressions" id="expressions" aria-label="표정 선택"></div>
<div class="divider"></div><div class="row"><span>배경</span><div class="tones" id="tones"><button data-tone="dark" aria-pressed="true">밤</button><button data-tone="paper" aria-pressed="false">밝게</button><button data-tone="grid" aria-pressed="false">투명 확인</button></div></div>
<button class="compare" id="compare" aria-pressed="false">원본과 비교</button><div class="status" role="status" id="status">스탠딩 불러오는 중…</div>
<div class="dialogue"><span class="speaker">마왕</span><p class="line" id="line">“……또 인간이냐.”</p></div><p class="help">← → 키로 표정을 바꿀 수 있습니다.<br>각 대사는 표정 확인용이며 본편 진행에는 영향을 주지 않습니다.</p></section></main>
<script src="./face-source.js?v=4"></script><script src="./portrait.js?v=4"></script><script>
const sample={angry:'“……또 인간이냐.”',uncomfortable:'“그렇게 가까이 오라고 한 적은 없다.”',disbelief:'“……뭐? 또 살아났다고?”',indifferent:'“그래서. 하고 싶은 말은 끝났나?”',curious:'“너는…… 대체 무엇이지?”',flustered:'“자, 잠깐! 아, 아니! 그런 뜻이 아니라……!”',jealous:'“아까 그 인간과는 무슨 이야기를 했지?”',shy:'“……너는 예외다.”',furious:'“……분명 경고했을 텐데.”',enraged:'“감히, 이 몸 앞에서!”',gloomy:'“오늘은…… 혼자 있고 싶군.”'};
const initial=Object.hasOwn(DemonPortrait.labels,location.hash.slice(1))?location.hash.slice(1):'angry';
const portrait=DemonPortrait.create(document.getElementById('portrait'),{expression:initial}),keys=Object.keys(DemonPortrait.labels);let selected=initial,comparing=false,request=0;
const status=document.getElementById('status'),compare=document.getElementById('compare');
async function show(key){selected=key;const seq=++request;document.getElementById('name').textContent=DemonPortrait.labels[key];document.getElementById('line').textContent=sample[key];document.querySelectorAll('[data-expression]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.expression===key)));try{await portrait.setExpression(comparing?'angry':selected);if(seq===request){const preset=DemonPortrait.presets[key];status.textContent=comparing?'기본 원본을 표시하고 있습니다.':preset.pose?DemonPortrait.poseRigs[preset.pose].label:'기본 자세 · 한 손을 허리에';}}catch{if(seq===request)status.textContent='파일을 불러오지 못했습니다. 페이지를 다시 열어주세요.';}}
for(const key of keys){const b=document.createElement('button');b.type='button';b.dataset.expression=key;b.textContent=DemonPortrait.labels[key].replace(' · 기본','');b.setAttribute('aria-pressed',String(key===selected));b.onclick=()=>show(key);document.getElementById('expressions').append(b);}
compare.onclick=()=>{comparing=!comparing;compare.setAttribute('aria-pressed',String(comparing));compare.textContent=comparing?'선택한 표정으로 돌아가기':'원본과 비교';show(selected);};
document.getElementById('tones').onclick=e=>{const b=e.target.closest('button');if(!b)return;document.getElementById('stage').dataset.tone=b.dataset.tone;document.querySelectorAll('[data-tone].tones button,#tones button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));};
document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();show(keys[(keys.indexOf(selected)+(e.key==='ArrowRight'?1:keys.length-1))%keys.length]);}});
show(initial);
portrait.ready.catch(()=>status.textContent='스탠딩 파일을 불러오지 못했습니다.');
</script></body></html>
