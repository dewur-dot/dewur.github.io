<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#050507"><title>세계 평화를 위해 결혼해주세요</title>
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050507;color:#eee6db;font-family:'Malgun Gothic',sans-serif}#stage{position:absolute;left:50%;top:50%;transform-origin:0 0;border:0;background:#080808;display:block}dialog{width:min(440px,calc(100% - 28px));max-height:90dvh;overflow:auto;border:1px solid #a8947166;border-radius:12px;background:#1b1b24;color:#eee6db;padding:24px;box-shadow:0 20px 80px #0009}dialog::backdrop{background:#0009}h1{font-size:20px;margin:0 0 18px}label{display:block;margin:18px 0 10px;font-size:14px}select,button{font:inherit}select{width:100%;background:#292936;color:#fff;border:1px solid #8d806c;padding:12px;border-radius:5px;font-size:15px}p{font-size:13px;line-height:1.7;color:#b9b5b0}button{cursor:pointer;border:1px solid #bda27d70;background:#35303a;color:#f6e7d1;border-radius:5px;padding:10px 16px}button:focus-visible,select:focus-visible{outline:2px solid #dfbd8f;outline-offset:3px}.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:22px}.apply{background:#d9c5a6;color:#211d19}#displayStatus{font-size:12px;color:#dfc69c}#rotateHint{position:fixed;inset:0;z-index:9;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;background:#050507;color:#f4e8d6}#rotateHint.on{display:flex}#rotateHint .phone{width:30px;height:54px;border:3px solid #dfc69c;border-radius:7px;position:relative;animation:rot 2.4s ease-in-out infinite}#rotateHint .phone::after{content:"";position:absolute;left:50%;bottom:4px;width:8px;height:2px;margin-left:-4px;background:#dfc69c;border-radius:2px}@keyframes rot{0%,20%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}#rotateHint strong{font-size:18px}#rotateHint p{margin:0;max-width:300px}#rotateHint .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:6px}#fsChip{position:fixed;left:50%;top:max(6px,env(safe-area-inset-top));transform:translateX(-50%);z-index:8;display:none;padding:3px;border-radius:999px;background:#100d13e0;font-size:12px}#fsChip button{padding:5px 12px;font-size:12px;border-radius:999px}#fsChip.on{display:block;animation:chip 9s ease forwards}@keyframes chip{0%,85%{opacity:1}100%{opacity:0;visibility:hidden}}.hint-small{font-size:12px!important;color:#9d958a!important;margin:6px 0 0}label.chk{display:flex;gap:8px;align-items:center;margin:12px 0 4px;font-size:13px;color:#cfc6b8}label.chk input{width:16px;height:16px}</style></head><body>
<iframe id="stage" title="세계 평화를 위해 결혼해주세요 게임" src="./game.html?v=20261016-room4" allow="fullscreen" allowfullscreen></iframe>
<dialog id="displaySettings" aria-labelledby="settingsTitle"><h1 id="settingsTitle">설정</h1><label for="resolution">게임 해상도</label><select id="resolution"><option value="auto">자동 · PC는 창에 맞는 가장 큰 16:9로 고정, 폰은 꽉 채움</option><option value="native">화면 꽉 채움 · 기기 화면 비율 그대로</option><option value="960x540">960 × 540 · 가로 16:9</option><option value="1280x720">1280 × 720 · 가로 HD</option><option value="1600x900">1600 × 900 · 가로 HD+</option><option value="1920x1080">1920 × 1080 · 가로 풀HD</option><option value="540x960">540 × 960 · 세로 9:16</option><option value="390x844">390 × 844 · 모바일 세로</option></select><label class="chk"><input type="checkbox" id="fitWindow"> 창 크기에 맞춰 화면 확대·축소 (끄면 선택한 해상도 크기로 고정)</label><p>고른 해상도 크기로 화면이 고정되고, 브라우저 창을 늘이거나 줄여도 게임 크기는 변하지 않습니다. 창이 해상도보다 작으면 스크롤됩니다. '화면 꽉 채움'은 여백 없이 기기 화면을 모두 사용합니다.</p><p>컷신(CG)은 화면을 가득 채웁니다. 그림과 화면 비율이 다르면 위아래나 좌우 일부가 잘릴 수 있습니다.</p><button id="fullscreenToggle" type="button">전체화면 켜기</button><p class="hint-small" id="fsNote"></p><div id="displayStatus" aria-live="polite"></div><div class="actions"><button id="cancel" type="button">닫기</button><button id="apply" class="apply" type="button">적용</button></div></dialog>
<div id="rotateHint" role="dialog" aria-live="polite"><div class="phone"></div><strong>가로 화면으로 플레이해 주세요</strong><p>폰을 옆으로 돌리면 화면이 꽉 차게 보입니다. 자동 회전이 꺼져 있다면 켜 주세요.</p><div class="row"><button id="rotateFull" class="apply" type="button">전체화면으로 시작</button><button id="rotateSkip" type="button">세로로 계속</button></div><p class="hint-small" id="rotateNote"></p></div><div id="fsChip" role="status"><button id="fsChipBtn" type="button">⛶ 전체화면으로 보기</button></div>
<script src="./display-settings.js?v=20261013-fs5"></script></body></html>
