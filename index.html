<body>
  <section class="menu-screen hidden" id="menuScreen" aria-label="메인 화면"><div class="menu-art"><img class="menu-image" src="./main-opening.png" alt="세계 평화를 위해 결혼해주세요 메인 일러스트"><svg class="hair-accents" viewBox="0 0 1536 1024" preserveAspectRatio="none" aria-hidden="true"><path class="strand" d="M627 318 C608 473 593 635 529 774 C503 831 465 876 434 912" stroke="#f5d9d3" stroke-width="5" opacity=".55"/><path class="strand" d="M1081 213 C1144 359 1220 493 1310 641 C1354 714 1398 772 1435 821" stroke="#f8e2da" stroke-width="6" opacity=".48"/></svg><img class="blink-eye blink-left" src="./main-opening-blink.png" alt="" aria-hidden="true"><img class="blink-eye blink-right" src="./main-opening-blink.png" alt="" aria-hidden="true"><i class="petal" style="--x:96%;--y:29%;--dur:9s;--delay:-1s"></i><i class="petal" style="--x:91%;--y:39%;--dur:11s;--delay:-6s"></i><i class="petal" style="--x:84%;--y:19%;--dur:10s;--delay:-3s"></i><i class="petal" style="--x:98%;--y:52%;--dur:13s;--delay:-8s"></i><i class="petal" style="--x:76%;--y:11%;--dur:12s;--delay:-4s"></i><button class="menu-hotspot menu-start" type="button" aria-label="시작하기"></button><button class="menu-hotspot menu-continue" type="button" aria-label="계속하기"></button><button class="menu-hotspot menu-settings" type="button" aria-label="설정"></button><button class="menu-hotspot menu-exit" type="button" aria-label="종료"></button><div class="menu-notice" id="menuNotice" aria-live="polite"></div><button class="demon-preview-open" id="demonPreviewOpen" type="button">마왕 루트 미리보기</button><button class="effects-open" id="effectsOpen" type="button">효과 미리보기 ✧</button></div></section>
  <section class="title-screen" id="titleScreen" aria-label="이야기 시작"><div class="comic"><div class="comic-line">세계는 전쟁으로 무너지고 있었다.</div><div class="comic-line">신들은 고민했다.</div><div class="comic-line">전쟁의 신: “그냥 인간을 전부 없애면 되잖아?”</div><div class="comic-line">다른 신들: “안 돼.”</div><div class="comic-line">그리고 사랑의 여신이 말했다.</div><div class="comic-line">“이번에는 제 차례네요.”</div></div><span class="skip-hint">클릭하면 메인 화면으로 ›</span></section><div class="flash" id="flash" aria-hidden="true"></div>
  <section class="effects-studio" id="effectsStudio" aria-label="효과 미리보기" hidden><div class="effects-card"><button class="effects-close" id="effectsClose" type="button" aria-label="닫기">×</button><div class="effects-heading"><small>VISUAL EFFECTS</small><h2>효과 미리보기</h2></div><div class="effects-stage"><canvas class="effects-canvas" id="effectsCanvas" aria-hidden="true"></canvas></div><div class="effects-actions"><button type="button" data-effect="surprise">놀람</button><button type="button" data-effect="slash">빛의 참격</button><button type="button" data-effect="hearts">하트</button><button type="button" data-effect="flash">섬광</button><button type="button" data-effect="sparkle">반짝임</button><button type="button" data-effect="bite">짐승의 습격</button><button type="button" data-effect="hit">피격</button><button type="button" data-effect="poison">독</button></div><p class="effects-caption" id="effectsCaption">효과를 선택하면 이곳에서 재생됩니다.</p></div></section>
  <main class="game">
    <div class="flash story-scene-flash" id="storyFlash" aria-hidden="true"></div><canvas class="story-effect-canvas" id="storyEffectCanvas" aria-hidden="true"></canvas>
    <div class="backdrop" id="backdrop" aria-hidden="true"></div><div class="shade" aria-hidden="true"></div><div class="magic" id="magic" aria-hidden="true"></div><img class="scene-goddess" id="sceneGoddess" src="./goddess-comic.png" alt="" aria-hidden="true" hidden><div class="scene-petals" id="scenePetals" aria-hidden="true"><span>✦</span><span>✦</span><span>✦</span></div>
    <header class="top"><div class="chapter" id="chapter">PROLOGUE</div></header>
    <section class="panel" id="panel" aria-live="polite"><div class="eyebrow" id="eyebrow"></div><div class="name" id="name"></div><p class="text" id="text"></p><div class="choices" id="choices"></div><div class="controls"><button class="control" id="auto" type="button" aria-pressed="true">자동넘기기 ●</button><button class="control" id="back" type="button">되돌리기 ↶</button></div><div class="meta"><span id="step"></span><div class="progress"><span id="bar"></span></div><span class="click-hint" aria-hidden="true">click</span></section>
  </main>
  <script src="./effects.js"></script>
  <script src="./demon-expressions/face-source.js?v=4"></script>
  <script src="./demon-expressions/portrait.js?v=4"></script>
  <script src="./demon-route.js"></script>
  <script>
    const line=(tag,who,text,art,next,visual)=>({tag,who,text,art,visual,choices:[['계속',next]]});
    const scenes=[
      line('서장 · 네 종족의 시대','이야기','이 대륙에는 인간, 마족, 엘프, 드워프가 살아간다. 오래전에는 대륙을 덮친 재앙에 맞서 같은 성벽을 지켰지만, 전쟁이 끝난 뒤 그들은 서로를 믿지 못했다.','war',1),
      line('서장 · 인간','이야기','인간은 무너진 국경을 지키려 성을 쌓았다. 부족한 땅을 넓힐수록 이웃의 땅과 길이 좁아졌고, 방패는 어느새 침략의 표식이 되었다.','human',2),
      line('서장 · 마족','이야기','마족은 황폐한 동쪽 땅에서 살아남았다. 인간은 그들의 뿔을 두려워했고, 마족은 두려움 때문에 먼저 겨누는 창을 기억했다.','demon',3),
      line('서장 · 엘프','이야기','엘프는 오래된 숲과 샘을 지켜 왔다. 나무를 베는 도끼와 숲을 가르는 군대 앞에서 그들은 활을 들었고, 다른 종족은 그 침묵을 오만으로 여겼다.','elf',4),
      line('서장 · 드워프','이야기','드워프는 산 아래에서 금속과 마법석을 벼렸다. 모두가 그들의 기술을 원했지만, 누구도 빼앗긴 광맥을 돌려주지 않았다.','dwarf',5),
      line('서장 · 끝나지 않은 전쟁','이야기','한 번의 오해가 보복이 되고, 보복은 또 다른 전쟁이 되었다. 왕들은 평화를 말하면서도 검을 놓지 못했다. 신들조차 이 균열을 어떻게 메워야 할지 알지 못했다.','war',6),
      line('한편, 작은 마을','이야기','한편, 국경에서 멀리 떨어진 작은 마을 벨룬. 돌길과 낮은 지붕이 이어지는 이곳에서는 네 종족의 이야기도 먼 나라 소식처럼 들렸다.','village',7),
      line('벨룬의 밤','이야기','낮에는 장터와 대장간이 시끄럽지만, 밤이 되면 벨룬은 별빛과 창가의 등불만 남는 조용한 마을이었다.','village',8),
      line('별을 보는 전사','이야기','당신은 침대에 누워 밤하늘을 바라보고 있었다. 낮 동안 방패를 들었던 두 팔은 머리 뒤에 느슨하게 괴어 있었다.','bedroom',9),
      line('별을 보는 전사','이야기','내일도 누군가를 지켜야 한다. 그런 생각을 하며 별을 세던 순간, 아무도 없는 방에서 목소리가 들렸다.','bedroom',10),
      line('???','???','“……정말이지.”','bedroom',11),
      line('???','???','“이 세계의 신들도 참 고집이 세다니까.”','bedroom',12,'light'),
      line('작은 빛','이야기','눈앞에 작은 분홍빛 하나가 나타났다. 먼지처럼 떠 있던 빛이 별 하나만큼 밝아지더니, 허공에 가느다란 틈을 냈다.','bedroom',13,'light'),
      line('공간의 틈','이야기','빛이 점점 커지고, 공간이 종잇장처럼 갈라졌다. 분홍 꽃잎 몇 장이 바닥에 내려앉고, 빛 너머로 누군가의 모습이 보였다.','bedroom',14,'portal'),
      line('뜻밖의 손님','사랑의 여신','“안녕하세요!”','bedroom',15,'goddess'),
      line('뜻밖의 손님','사랑의 여신','“저는 사랑의 여신이에요.”','bedroom',16,'goddess'),
      line('뜻밖의 손님','주인공','“……네?”','bedroom',17,'goddess'),
      line('여신의 선언','사랑의 여신','“그리고 당신은 오늘부터...”','bedroom',18,'goddess'),
      line('여신의 선언','이야기','여신이 환하게 웃었다. 방 안에 남은 꽃잎이 아주 잠깐 떠올랐다.','bedroom',19,'goddess'),
      line('여신의 선언','사랑의 여신','“세계를 구하기 위해 결혼해야 합니다.”','bedroom',20,'goddess'),
      line('여신의 선언','주인공','“뭐라고요?”','bedroom',21,'goddess'),
      line('여신의 선언','사랑의 여신','“후후.”','bedroom',22,'goddess'),
      line('신들의 회의','사랑의 여신','“전쟁의 신은 인간을 전부 없애자고 했어요.”','bedroom',23,'goddess'),
      line('신들의 회의','사랑의 여신','“그래서 다른 신들이 때렸어요.”','bedroom',24,'goddess'),
      line('신들의 회의','사랑의 여신','“많이.”','bedroom',25,'goddess'),
      line('신들의 회의','사랑의 여신','“아주 많이.”','bedroom',26,'goddess'),
      line('신들의 회의','사랑의 여신','“그래서 이번에는 제가 나서기로 했답니다.”','bedroom',27,'goddess'),
      {tag:'여신의 계획',who:'사랑의 여신',text:'“서로를 지키겠다는 마음에서 평화가 시작될 수도 있어요. 당신이 그 첫 인연을 맺어 주세요.”',art:'bedroom',visual:'goddess',choices:[['“왜 저를 선택했나요?”',28],['“결혼이 어떻게 평화를 만들죠?”',29]]},
      line('말해 주지 않는 이유','사랑의 여신','여신은 씩 웃었다. “그 이유는 나중에 기회가 되면 알려드릴게요.”','bedroom',30,'goddess'),
      line('작은 약속','사랑의 여신','“조약 한 장보다, 서로를 지키기로 한 두 사람이 더 오래 남을 때가 있어요.”','bedroom',30,'goddess'),
      line('인연의 문답','사랑의 여신','“그럼 당신 마음의 방향을 알아볼까요? 정답은 없어요. 마음이 가는 대로 골라 주세요.”','bedroom',31,'goddess'),
      {tag:'질문 1 / 4',who:'사랑의 여신',text:'“호랑이, 토끼, 강아지. 함께 길을 떠난다면 누구를 고를래요?”',art:'bedroom',visual:'goddess',choices:[['호랑이 — 믿음직한 용기가 좋아',32,'sera'],['토끼 — 조용한 영리함이 좋아',32,'lune'],['강아지 — 다정한 활기가 좋아',32,'mira']]},
      {tag:'질문 2 / 4',who:'사랑의 여신',text:'“낯선 종족의 마을에서 환영받지 못한다면?”',art:'bedroom',visual:'goddess',choices:[['앞에 서서 모두를 설득한다',33,'sera'],['먼저 그들의 사정을 살핀다',33,'lune'],['작은 일부터 함께 돕는다',33,'mira']]},
      {tag:'질문 3 / 4',who:'사랑의 여신',text:'“전투가 끝난 밤, 곁에 있는 사람에게 가장 듣고 싶은 말은?”',art:'bedroom',visual:'goddess',choices:[['“네 덕분에 모두 살아남았어.”',34,'sera'],['“혼자 짊어지지 않아도 돼.”',34,'lune'],['“내일도 같이 웃자.”',34,'mira']]},
      {tag:'질문 4 / 4',who:'사랑의 여신',text:'“평화가 찾아온다면, 어떤 곳에서 그 사람과 쉬고 싶어요?”',art:'bedroom',visual:'goddess',choices:[['사람들이 모이는 성벽 위',35,'sera'],['고요한 숲속 작은 집',35,'lune'],['여행자들이 드나드는 여관',35,'mira']]},
      line('이번 회차의 인연','사랑의 여신','“좋아요. 당신의 대답이 한 사람에게 닿았어요. 이제 그 인연을 어떻게 지킬지는 당신의 선택이랍니다.”','bedroom',36,'goddess')
    ];
    const artFiles={war:'mural-war-v2.png',human:'mural-human.png',demon:'mural-demon.png',elf:'mural-elf.png',dwarf:'mural-dwarf.png',village:'bellune-night.png',bedroom:'bedroom-comic.png',room:'room-wall-comic.png'};
    const heroines={sera:{name:'마왕',kind:'마계의 지배자',desc:'끊임없이 찾아오는 인간 용사들에게 지친 마왕. 당신의 첫인상 역시, 또 한 명의 침입자다. 호감도 −100에서 시작한다.'},lune:{name:'루네',kind:'숲의 종족 치유사',desc:'말보다 행동을 믿는 치유사. 오래된 불신 너머의 마음을 볼 줄 안다.'},mira:{name:'미라',kind:'산의 종족 마도공학자',desc:'낙천적인 발명가. 닫힌 성문을 열 방법을 늘 새롭게 찾는다.'}};
    let scene=0;let scores={sera:0,lune:0,mira:0};let first=null;let auto=true;let started=false;let timer=null;const history=[];
    const $=id=>document.getElementById(id);
    function flashNow(){const flash=$('flash');flash.classList.remove('active');void flash.offsetWidth;flash.classList.add('active')}
    const effectDirector=new EffectDirector($('effectsCanvas'));
    const storyPlayer=new EffectCuePlayer($('storyEffectCanvas'),$('storyFlash'));
    const prologueEffects={12:[[0,'sparkle']],14:[[0,'flash'],[180,'sparkle']],20:[[0,'surprise']]};
    document.addEventListener('visibilitychange',()=>{if(document.hidden)storyPlayer.clear()});
    function playEffect(type){if($('effectsStudio').hidden)return;$('flash').classList.remove('active');if(type==='flash'){effectDirector.clear();flashNow()}else effectDirector.play(type)}
    function move(next,key){clearTimeout(timer);history.push({scene,scores:{...scores},first});if(key){scores[key]++;if(!first)first=key}scene=next;render();storyPlayer.play(prologueEffects[next]||[])}
    function isLinear(s){return s&&s.choices.length>0&&s.choices.every(choice=>choice[1]===s.choices[0][1]&&!choice[2])}
    function render(){clearTimeout(timer);storyPlayer.clear();const s=scenes[scene];const result=scene===scenes.length;const art=scene>=10?'room':(s?.art||'room');const visual=s?.visual||'';$('backdrop').style.backgroundImage=`url('./${artFiles[art]}')`;$('backdrop').classList.toggle('wide',art==='war');$('backdrop').classList.toggle('bed-art',art==='bedroom');$('backdrop').classList.toggle('room-art',art==='room');$('sceneGoddess').hidden=!(visual==='goddess'||result);$('magic').className='magic'+(visual==='light'||visual==='portal'?' '+visual:'');$('scenePetals').classList.toggle('visible',visual==='portal'||visual==='goddess');$('panel').classList.toggle('result',result);$('chapter').textContent=result?'CHAPTER 1 · PREVIEW':scene>=31?'FATE TEST':scene>=6?'CHAPTER 1':'PROLOGUE';$('eyebrow').textContent=s?.tag||'첫 장 · 인연의 시작';$('name').textContent=s?.who||'이번 회차의 상대';$('choices').replaceChildren();
      if(result){const order=['sera','lune','mira'];const key=order.sort((a,b)=>scores[b]-scores[a]||(a===first?-1:b===first?1:0))[0];const h=heroines[key];$('text').innerHTML='<strong class="route">'+h.name+'</strong><br>'+h.kind+'<br><br>'+h.desc+'<br><br>여신은 마지막으로 속삭인다. “이 인연을 결혼까지 지킬 수 있을까?”';$('eyebrow').textContent='프롤로그 완료 · '+h.name+' 루트';if(key==='sera')addChoice('마왕과 첫 만남 시작하기',()=>openDemonRoute(false));addChoice('다시 시작하기',()=>{scene=0;scores={sera:0,lune:0,mira:0};first=null;history.length=0;render()});}
      else{$('text').textContent=s.text;if(!isLinear(s))for(const [label,next,key] of s.choices)addChoice(label,()=>move(next,key))}
      $('back').disabled=history.length===0;$('auto').classList.toggle('active',auto);$('auto').setAttribute('aria-pressed',String(auto));$('auto').textContent=auto?'자동넘기기 ●':'자동넘기기 ○';
      $('step').textContent=result?'첫 만남부터 결혼까지 · 다음 장에서 계속':`${scene+1} / ${scenes.length+1}`;$('bar').style.width=((scene+1)/(scenes.length+1)*100)+'%';window.scrollTo({top:0,behavior:'smooth'});
      if(started){try{localStorage.setItem('peace-marriage-save-v2',JSON.stringify({scene,scores,first}))}catch{}}
      if(started&&auto&&isLinear(s)){const delay=Math.min(18000,Math.max(5000,s.text.length*125));timer=setTimeout(()=>move(s.choices[0][1]),delay)}}
    function addChoice(label,action){const b=document.createElement('button');b.className='choice';b.type='button';b.textContent=label;b.addEventListener('click',action);$('choices').append(b)}
    $('auto').addEventListener('click',()=>{auto=!auto;render()});
    $('back').addEventListener('click',()=>{const previous=history.pop();if(!previous)return;scene=previous.scene;scores=previous.scores;first=previous.first;render()});
    document.querySelector('.game').addEventListener('click',event=>{if(!started||event.target.closest('button'))return;const current=scenes[scene];if(isLinear(current))move(current.choices[0][1])});
    const comicLines=[...document.querySelectorAll('.comic-line')];
    const introTimers=[];let introDone=false;
    function scheduleIntro(action,delay){introTimers.push(setTimeout(action,delay))}
    function showMenu(){if(introDone)return;introDone=true;introTimers.forEach(clearTimeout);$('titleScreen').classList.add('hidden');$('menuScreen').classList.remove('hidden')}
    function beginIntro(){
      comicLines.forEach((line,index)=>{const at=500+index*3000;scheduleIntro(()=>line.classList.add('shown'),at);scheduleIntro(()=>line.classList.add('leaving'),at+1900);scheduleIntro(()=>line.classList.add('past'),at+2800)});
      scheduleIntro(showMenu,18500);
    }
    $('titleScreen').addEventListener('click',showMenu);
    document.addEventListener('keydown',event=>{if(!introDone&&(event.key==='Enter'||event.key===' ')){event.preventDefault();showMenu()}});
    function openDemonRoute(resume){clearTimeout(timer);storyPlayer.clear();started=false;$('menuScreen').classList.add('hidden');DemonRoute.open({resume,onExit:()=>{$('menuScreen').classList.remove('hidden')}})}
    $('demonPreviewOpen').addEventListener('click',()=>openDemonRoute(DemonRoute.hasSave()));
    function enterGame(){try{localStorage.setItem('peace-marriage-active-route','prologue')}catch{}started=true;$('menuScreen').classList.add('hidden');render()}
    document.querySelector('.menu-start').addEventListener('click',()=>{scene=0;scores={sera:0,lune:0,mira:0};first=null;history.length=0;enterGame()});
    document.querySelector('.menu-continue').addEventListener('click',()=>{try{if(localStorage.getItem('peace-marriage-active-route')==='demon'&&DemonRoute.hasSave()){openDemonRoute(true);return}}catch{}let save;try{save=JSON.parse(localStorage.getItem('peace-marriage-save-v2'))}catch{}if(!save){$('menuNotice').textContent='저장된 이야기가 없습니다.';return}scene=save.scene;scores=save.scores;first=save.first;history.length=0;enterGame()});
    document.querySelector('.menu-settings').addEventListener('click',()=>{auto=!auto;$('menuNotice').textContent='자동넘기기: '+(auto?'켜짐':'꺼짐')});
    document.querySelector('.menu-exit').addEventListener('click',()=>$('menuNotice').textContent='종료하려면 브라우저 탭을 닫아주세요.');
    document.querySelector('.menu-art').addEventListener('click',event=>{if(event.target.closest('button'))return;const rect=event.currentTarget.getBoundingClientRect();const x=(event.clientX-rect.left)/rect.width;const y=(event.clientY-rect.top)/rect.height;if(x<.05||x>.30||y<.58||y>.83)return;const rows=[.626,.68,.734,.788];const index=rows.reduce((best,row,i)=>Math.abs(row-y)<Math.abs(rows[best]-y)?i:best,0);document.querySelectorAll('.menu-hotspot')[index].click()});
    $('effectsOpen').addEventListener('click',()=>{$('effectsStudio').hidden=false;$('effectsCaption').textContent='효과를 선택하면 이곳에서 재생됩니다.'});
    $('effectsClose').addEventListener('click',()=>{$('effectsStudio').hidden=true;effectDirector.clear();$('flash').classList.remove('active')});
    document.querySelectorAll('[data-effect]').forEach(button=>button.addEventListener('click',()=>{playEffect(button.dataset.effect);$('effectsCaption').textContent=button.textContent+' 효과'}));
    document.addEventListener('keydown',event=>{if(event.key==='Escape'&&!$('effectsStudio').hidden)$('effectsClose').click()});
    beginIntro();
    render();
  </script>
</body>
</html>
